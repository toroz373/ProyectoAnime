<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="feed-container">
  <div class="feed-header">
    <div class="header-content">
      <h1>Bienvenido/a, {{ authService.currentUser()?.name }}</h1>
    </div>
  </div>
  
  <div class="feed-content">
    <!-- Recorre los animes y muestra una tarjeta por cada uno -->
    @for (anime of animes(); track anime.id) {
      <app-anime-card 
        [anime]="anime"
        [isLoggedIn]="true"
        [currentUserId]="currentUserId"
        [currentUserName]="authService.currentUser()?.name || ''"
        [showStatusButtons]="true">
      </app-anime-card>
    }
  </div>
</div>

<div class="sort-container">
  <!-- Texto de ordenar -->
  <span class="sort-label">Ordenar por:</span>

  <!-- Botón para abrir/cerrar opciones -->
  <div class="sort-dropdown" (click)="toggleSort()">
    <span>{{ selectedSortLabel }}</span>
    <span class="arrow">▼</span>
  </div>

  <!-- Opciones de orden -->
  <div class="sort-options" *ngIf="isSortOpen">
    <div (click)="selectSort('rating')">Valoraciones</div>
    <div (click)="selectSort('az')">A-Z</div>
  </div>
</div>
