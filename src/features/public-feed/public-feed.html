<app-header></app-header>

<div class="feed-container">
  <div class="feed-header">
    <h1>Feed Público</h1>
    <p>Descubre animes y lee las opiniones de la comunidad</p>
  </div>
  
  <div class="feed-content">
    @for (anime of animeService.filteredAnimes(); track anime.id) {
      <app-anime-card 
        [anime]="anime"
        [isLoggedIn]="false"
        [currentUserId]="0"
        [currentUserName]="''">
      </app-anime-card>
    }
  </div>
</div>

<div class="sort-container">
  <span class="sort-label">Ordenar por:</span>

  <div class="sort-dropdown" (click)="toggleSort()">
    <span>{{ selectedSortLabel }}</span>
    <span class="arrow">▼</span>
  </div>

  <div class="sort-options" *ngIf="isSortOpen">
    <div (click)="selectSort('rating')">Valoraciones</div>
    <div (click)="selectSort('az')">A-Z</div>
  </div>
</div>
