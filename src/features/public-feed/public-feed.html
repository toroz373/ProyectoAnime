<app-header></app-header>

<div class="feed-container">
  <div class="feed-header">
    <h1>Feed Público</h1>
    <p>Descubre animes y lee las opiniones de la comunidad</p>
  </div>
  
  <div class="feed-content">
    <!-- Recorre los animes filtrados y muestra una tarjeta por cada uno -->
    @for (anime of animeService.filteredAnimes(); track anime.id) {
      <app-anime-card 
        [anime]="anime"
        [isLoggedIn]="authService.isLoggedIn()"
        [currentUserId]="currentUserId"
        [currentUserName]="authService.currentUser()?.name || ''">
      </app-anime-card>
    }
  </div>
</div>

<div class="sort-container">
  <!-- Texto de ordenar -->
  <span class="sort-label">Ordenar por:</span>

  <!-- Botón que abre/cierra el desplegable -->
  <div class="sort-dropdown" (click)="toggleSort()">
    <span>{{ selectedSortLabel }}</span>
    <span class="arrow">▼</span>
  </div>

  <!-- Opciones de orden -->
  <div class="sort-options" *ngIf="isSortOpen">
    <div (click)="selectSort('rating')">Valoraciones</div>
    <div (click)="selectSort('az')">A-Z</div>
  </div>
</div>
