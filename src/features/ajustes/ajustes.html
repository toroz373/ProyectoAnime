<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="pagina-ajustes" [ngClass]="usuario.theme">

  <div class="ajustes-card">

    <!-- PERFIL -->
    <div class="section perfil">

      <!-- IZQUIERDA -->
      <div class="perfil-izquierda">
        <div class="avatar">

          <img 
            [src]="
              usuario.avatar
                ? (usuario.avatar.startsWith('data:')
                    ? usuario.avatar
                    : 'http://localhost/ProyectoAnime/backend-php/uploads/' + usuario.avatar)
                : 'assets/default-avatar.png'
            ">

          <input type="file" (change)="cambiarImagen($event)" hidden #file>
          <button class="btn-plus" (click)="file.click()">+</button>

        </div>
      </div>

      <!-- DERECHA -->
      <div class="perfil-derecha">

        <!-- DESCRIPCIÓN -->
        <div class="desc-container">
          <textarea
            class="descripcion"
            [(ngModel)]="usuario.descripcion"
            placeholder="Pon tu descripción..."
            maxlength="250"
          ></textarea>

          <button class="btn-guardar-desc" (click)="guardarDescripcion()">
            Guardar
          </button>

          <div class="message-container">
            <div *ngIf="mensajeDescripcion" class="success-message">
              ✔ {{ mensajeDescripcion }}
            </div>
          </div>
        </div>

        <!-- BOTÓN EDITAR -->
        <button class="btn-rosa btn-editar" (click)="editar = !editar">
          Editar perfil
        </button>

        <!-- 🔥 PANEL EDICIÓN (MOVIDO AQUÍ) -->
        <div class="panel-edicion" *ngIf="editar">

          <!-- IZQUIERDA PANEL -->
          <div class="columna">

            <input [(ngModel)]="usuario.usuario" placeholder="Usuario">
            <input [(ngModel)]="usuario.link" placeholder="Link">

            <button class="btn-rosa btn-aplicar" (click)="guardarCambios()">
              Aplicar cambios
            </button>

            <div class="message-container">

              <!-- ERROR -->
              <div *ngIf="errorPerfil" class="login-error">
                <img src="/miruabiertainversa.png" class="error-icon">
                <div>{{ errorPerfil }}</div>
              </div>

              <!-- SUCCESS -->
              <div *ngIf="mensajePerfil" class="success-message">
                ✔ {{ mensajePerfil }}
              </div>

            </div>

          </div>

          <!-- DERECHA PANEL -->
          <div class="columna">

            <button class="btn-eliminar-inline" (click)="eliminarAvatar()">
              Eliminar foto
            </button>

            <div class="toggle-container">
              ☀️
              <label class="switch">
                <input type="checkbox"
                      [checked]="usuario.theme === 'dark'"
                      (change)="cambiarTema()">
                <span class="slider"></span>
              </label>
              🌙
            </div>

            <button class="btn-eliminar-cuenta" (click)="confirmarEliminarCuenta()">
              Eliminar perfil
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>
</div>
