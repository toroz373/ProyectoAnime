<app-header></app-header>

<div class="layout">
  <app-sidebar></app-sidebar>

  <main class="content">

    <div *ngIf="loading">
      Cargando animes...
    </div>

    <div class="empty-state" *ngIf="!loading && animes.length === 0">
  
      <div class="empty-icon">
        <img src="logo-vistos.png" alt="Deseados" />
      </div>

      <h2>Tu lista está vacía</h2>
      <p>No tienes animes en vistos todavía</p>

    </div>

    <div class="anime-grid" *ngIf="!loading && animes.length > 0">

      <div class="anime-card" *ngFor="let anime of animes">

        <div class="card-image">
          <img [src]="anime.imagen" [alt]="anime.titulo" />

          <div class="menu">
            <button (click)="toggleMenu(anime)">⋮</button>

            <div class="dropdown" *ngIf="anime.showMenu">
              <button (click)="moverA('deseado', anime)">Mover a deseados</button>
              <button (click)="moverA('en_proceso', anime)">Mover a proceso</button>
              <button class="btn-eliminar" (click)="eliminarDeDeseados(anime)">Eliminar</button>
            </div>
          </div>
        </div>

        <button class="btn-sinopsis" (click)="toggleSinopsis(anime)">
          {{ anime.showSinopsis ? 'Ocultar sinopsis' : 'Ver sinopsis' }}
        </button>

        <div class="sinopsis" *ngIf="anime.showSinopsis">
          {{ anime.sinopsis }}
        </div>

      </div>

    </div>

  </main>
</div>
