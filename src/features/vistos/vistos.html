<app-header></app-header>

<div class="layout">
  <app-sidebar></app-sidebar>

  <main class="content">
    <h2>Animes vistos</h2>

    <div *ngIf="loading">
      Cargando animes...
    </div>
    <div *ngIf="!loading && animes.length === 0">
      No tienes animes vistos todavía
    </div>
    <div class="anime-list" *ngIf="!loading && animes.length > 0">
      <app-anime-mini-card
        *ngFor="let anime of animes"
        [anime]="anime">
      </app-anime-mini-card>
    </div>

  </main>
</div>
