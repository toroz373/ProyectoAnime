<div class="register-page">

  <!-- botón volver -->
  <div class="top-left">
    <a routerLink="/" class="back-button">Volver</a>
  </div>

  <div class="login-container">

    <!-- logo -->
    <img src="/Logo MiruZone.png" alt="Logo MiruZone" class="logo">

    <!-- formulario de registro -->
    <form (ngSubmit)="register()">

      <!-- usuario -->
      <input type="text"
        [(ngModel)]="usuario"
        name="usuario"
        placeholder="Usuario">

      <!-- error usuario -->
      <div class="field-error" *ngIf="usuarioError">
        {{ usuarioError }}
      </div>

      <!-- link / @usuario -->
      <input type="text"
        [(ngModel)]="link"
        name="link"
        placeholder="@usuario">

      <!-- error link -->
      <div class="field-error" *ngIf="linkError">
        {{ linkError }}
      </div>

      <!-- contraseña -->
      <div class="password-wrapper">

        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Contraseña">

        <!-- botón ojo -->
        <button type="button" class="eye-button" (click)="togglePassword()">

          <!-- ojo cerrado -->
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 5c5 0 9 4 10 7-1 3-5 7-10 7S3 15 2 12c1-3 5-7 10-7zm0 2C8 7 5 10 4 12c1 2 4 5 8 5s7-3 8-5c-1-2-4-5-8-5zm0 2a3 3 0 100 6 3 3 0 000-6z"/>
          </svg>

          <!-- ojo abierto -->
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M3 4l17 17-1.5 1.5-3-3C14 20 13 20 12 20 7 20 3 16 2 12c.7-1.8 2-3.5 3.6-4.9L1.5 5.5 3 4zm9 3c4.5 0 8.5 3.5 9 5-.3 1-1.2 2.3-2.5 3.6l-2-2C17 12 16 10 12 10c-.6 0-1.2.1-1.8.3L8.9 8.1C10 7.4 11 7 12 7zm0 3a2 2 0 012 2c0 .3-.1.6-.2.9l-2.7-2.7c.3-.1.6-.2.9-.2z"/>
          </svg>

        </button>

      </div>

      <!-- error contraseña -->
      <div class="field-error" *ngIf="passwordError">
        {{ passwordError }}
      </div>

      <!-- botón registrarse -->
      <button type="submit">Registrarse</button>

    </form>

    <!-- mensaje error -->
    <div class="login-error" *ngIf="mensaje && error">
      <img src="/miruabiertainversa.png" class="error-icon">
      <span>{{ mensaje }}</span>
    </div>

    <!-- mensaje éxito -->
    <div class="success-message" *ngIf="mensaje && !error">

      <div class="success-text">
        <div class="title">Registro completado correctamente.</div>
        <div class="subtitle">Bienvenido a MiruZone</div>
      </div>

    </div>

  </div>

</div>

<!-- footer -->
<footer>
  <p>@MiruZone © 2026</p>
</footer>
