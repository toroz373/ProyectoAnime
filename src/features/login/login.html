<div class="login-page">

  <!-- Botón para entrar sin usuario -->
  <div class="guest-container">
    <button class="guest-button" (click)="enterAsGuest()">
      Entrar sin usuario
    </button>
  </div>

  <div class="login-container">

    <!-- Logo -->
    <img src="/Logo MiruZone.png" alt="MiruZone" class="logo">

    <!-- INPUT USUARIO -->
    <div class="input-group">
      <input
        type="text"
        placeholder="Usuario"
        [(ngModel)]="usuario"
        [class.error]="usuarioError"
      >

      <!-- Error del usuario -->
      <div class="field-error" *ngIf="usuarioError">
        {{ usuarioError }}
      </div>
    </div>

    <!-- INPUT CONTRASEÑA -->
    <div class="input-group">
      <div class="password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Contraseña"
          [(ngModel)]="password"
          [class.error]="passwordError"
        >

        <!-- Botón del ojo para mostrar/ocultar contraseña -->
        <button type="button" class="eye-button" (click)="togglePassword()">

          <!-- Icono ojo cerrado -->
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 5c5 0 9 4 10 7-1 3-5 7-10 7S3 15 2 12c1-3 5-7 10-7zm0 2C8 7 5 10 4 12c1 2 4 5 8 5s7-3 8-5c-1-2-4-5-8-5zm0 2a3 3 0 100 6 3 3 0 000-6z"/>
          </svg>

          <!-- Icono ojo abierto -->
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M3 4l17 17-1.5 1.5-3-3C14 20 13 20 12 20 7 20 3 16 2 12c.7-1.8 2-3.5 3.6-4.9L1.5 5.5 3 4zm9 3c4.5 0 8.5 3.5 9 5-.3 1-1.2 2.3-2.5 3.6l-2-2C17 12 16 10 12 10c-.6 0-1.2.1-1.8.3L8.9 8.1C10 7.4 11 7 12 7zm0 3a2 2 0 012 2c0 .3-.1.6-.2.9l-2.7-2.7c.3-.1.6-.2.9-.2z"/>
          </svg>

        </button>

      </div>

      <!-- Error de contraseña -->
      <div class="field-error" *ngIf="passwordError">
        {{ passwordError }}
      </div>

    </div>

    <!-- Botón de login -->
    <button class="login-button" (click)="login()">
      Acceder
    </button>

    <!-- Error del login -->
    <div class="login-error" *ngIf="showLoginError">
      <img src="/miruabiertainversa.png" alt="error" class="error-icon">
      <span>{{ loginError }}</span>
    </div>

    <!-- Links secundarios -->
    <a routerLink="/nuevacontrasena" class="link-button">Nueva contraseña</a>
    <a routerLink="/nuevousuario" class="link-button">Nuevo usuario</a>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>@MiruZone © 2026</p>
  </footer>

</div>
