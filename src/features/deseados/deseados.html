<app-header></app-header>

<div class="layout">
  <app-sidebar></app-sidebar>

  <main class="content">


    <div *ngIf="loading">
      Cargando animes...
    </div>

    <div *ngIf="!loading && animes.length === 0">
      No tienes animes deseados
    </div>

    <div class="anime-grid" *ngIf="!loading && animes.length > 0">
      
      <div class="anime-card" *ngFor="let anime of animes">

        <div class="card-image">
          <img [src]="anime.imagen" alt="{{anime.titulo}}" />

          <!-- Menú 3 puntos -->
          <div class="menu">
            <button (click)="toggleMenu(anime)">⋮</button>

            <div class="dropdown" *ngIf="anime.showMenu">
              <button (click)="moverA('visto', anime)">Mover a vistos</button>
              <button (click)="moverA('proceso', anime)">Mover a proceso</button>
            </div>
          </div>
        </div>

        <!-- Botón sinopsis -->
        <button class="btn-sinopsis" (click)="toggleSinopsis(anime)">
          {{ anime.showSinopsis ? 'Ocultar sinopsis' : 'Ver sinopsis' }}
        </button>

        <!-- Sinopsis -->
        <div class="sinopsis" *ngIf="anime.showSinopsis">
          {{ anime.sinopsis }}
        </div>

      </div>

    </div>

  </main>
</div>
